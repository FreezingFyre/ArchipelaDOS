###################
# DISCORD OPTIONS #
###################

# The Discord bot token used to authenticate with the Discord API.
discord_token: null

# The Discord server in which to operate. This must be given as a server name. Currently, the bot
# can only operate in one server.
discord_server: null

# The character to use as the prefix for Discord commands. The character must be non-alphanumeric.
discord_command_prefix: "!"

# The Discord channel(s) in which to service user commands. These must be given as channel names.
discord_command_channels: []

# The Discord channel(s) in which to broadcast. These must be given as a mapping from channel
# names to a list of which message types to broadcast in the channel. If the list is empty, all
# messages will be broadcast to that channel. These are the message types:
#
#   - "progression_items": Broadcast progression item sends.
#   - "useful_items": Broadcast useful item sends (includes progression).
#   - "all_items": Broadcast all item sends (includes useful and progression, excludes traps).
#   - "trap_items": Broadcast trap item sends.
#   - "death_links": Broadcast death link messages.
#   - "join_leave": Broadcast player join and leave messages.
#   - "player_chat": Broadcast when a player sends a chat message.
#   - "server_chat": Broadcast when the server sends a global chat message.
#   - "goal_reached": Broadcast when a player reaches their goal.
#   - "admin_alerts": Broadcast alerts related to bot status, like when it disconnects.
#
# Note that at least one channel *must* be configured to broadcast "admin_alerts". Here is an
# example for this configuration, so that messages are sent to the channels "all-messages" and
# "specific-messages":
#
# discord_broadcast_channels: {
#     "all-messages": [],
#     "specific-messages": ["progression_items", "death_links", "goal_reached"]
# }
discord_broadcast_channels: {}

# The Discord channel(s) in which *not* to mention users for subscribed item sends. These must be
# given as channel names. Useful if item send notifications are being broadcast to multiple channels.
discord_mention_channel_blacklist: []


###################
# COMMAND DETAILS #
###################

# List of extra commands to enable. These commands may not be suitable for all users/servers, as
# they can be easily abused. These are the extra commands that can be enabled:
#
#   - "deathlink": Triggers an immediate death link
#   - "deathpoll": Optionally triggers a death link after holding a poll that server users vote on
#
extra_commands_enabled: []

# Cooldowns for extra commands that are enabled. These must be given as a mapping from the extra
# command name (as in the above list) to the cooldown time as a string with h/m/s units. Note that if
# no cooldown is set here for a command type, it has no cooldown. Here is an example for this
# configuration that sets cooldowns for both "deathlink" and "deathpoll" commands:
#
# extra_command_cooldowns: {
#     "deathlink": "5m",
#     "deathpoll": "15m"
# }
extra_command_cooldowns: {}

# Default, minimum, and maximum timeouts for the "deathpoll" command, assuming it's enabled. The default
# is necessary, but the min/max can be set to null if no such bounds are desired. If specified, these
# should be times expressed as strings with h/m/s units. For example: "5m" or "1m30s".
deathpoll_timeout_default: 3m
deathpoll_timeout_minimum: 30s
deathpoll_timeout_maximum: null

# Overrides for the emojis used in death polls. If specified, these should be literal emojis or names
# of guild emojis.
deathpoll_yes_emoji_override: null
deathpoll_no_emoji_override: null


#########################
# MISCELLANEOUS OPTIONS #
#########################

# The directory in which to store persistent bot data, so the bot can be restarted. Files in
# this directory will be created per-room, so different rooms will not interfere with each other.
data_path: data

# The file containing custom death link messages, if desired. This file should be formatted with one
# message per line, where each line generally includes a {player} token that will be replaced with
# the name of the player who died.
#
# You can also denote messages that should specifically be used when the the bot triggers a death link
# via the "deathlink"/"deathpoll" commands by starting a line with "BOT_DEATHLINK:" or "BOT_DEATHPOLL:".
# For these lines, the {player} token is optional. If no messages for "deathlink"/"deathpoll" are
# specified, those death links will pull from the normal pool of messages.
#
# Here is an example of the contents of this file:
#
# {player} made like a tree and got the hell out of there.
# {player} was squished into a {player} sandwich.
# {player} died of dysentery.
# BOT_DEATHLINK: ArchipelaDOS gave the thumbs-down.
# BOT_DEATHPOLL: The judgement was decisive, and the justice is swift.
#
death_link_messages_path: null

# The minimum logging level to record. Must be one of: "debug", "info", "warning", "error", "critical".
logging_level: info

# Whether to log to the console in brilliant colors.
logging_color: true
